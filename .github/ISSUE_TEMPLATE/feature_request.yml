name: ✨ Feature request
description: Propose a car rental workflow or platform improvement.
title: '[FEATURE]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user need
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: routes
    attributes:
      label: Routes, pages, and data changes
      description: Include middleware, model/migration, and UI behavior.
  - type: textarea
    id: security
    attributes:
      label: Security, ownership, and privacy impact
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and test cases
    validations:
      required: true
