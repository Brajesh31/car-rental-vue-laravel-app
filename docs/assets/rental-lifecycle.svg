<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Rental lifecycle</title><desc id="desc">Pending rental can be confirmed or cancelled. Confirmed rental becomes active, then completed.</desc>
<rect width="1000" height="420" rx="24" fill="#111827"/><text x="55" y="60" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Rental Lifecycle</text>
<g font-family="Arial,sans-serif" font-size="22" text-anchor="middle"><rect x="60" y="165" width="170" height="95" rx="16" fill="#1d4ed8"/><text x="145" y="222" fill="#fff">Pending</text><rect x="340" y="165" width="170" height="95" rx="16" fill="#0f766e"/><text x="425" y="222" fill="#fff">Confirmed</text><rect x="620" y="165" width="170" height="95" rx="16" fill="#a16207"/><text x="705" y="222" fill="#fff">Active</text><rect x="820" y="310" width="150" height="75" rx="16" fill="#166534"/><text x="895" y="357" fill="#fff">Completed</text><rect x="340" y="310" width="170" height="75" rx="16" fill="#991b1b"/><text x="425" y="357" fill="#fff">Cancelled</text></g>
