<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Car rental application architecture</title><desc id="desc">Browser connects to Laravel application, which connects to database, queue and mail provider. Vue and Inertia power the user interface.</desc>
