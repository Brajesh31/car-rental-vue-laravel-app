<text x="60" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Car Rental Application Architecture</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="70" y="190" width="230" height="150" rx="18" fill="#1e3a8a"/><text x="185" y="250" fill="#fff" font-size="25" font-weight="700">Browser</text><text x="185" y="288" fill="#dbeafe" font-size="18">Vue 3 + Inertia</text>
<rect x="390" y="190" width="250" height="150" rx="18" fill="#166534"/><text x="515" y="250" fill="#fff" font-size="25" font-weight="700">Laravel 12</text><text x="515" y="288" fill="#dcfce7" font-size="18">Routes • Auth • Domain</text>
<rect x="760" y="95" width="300" height="125" rx="18" fill="#7c2d12"/><text x="910" y="148" fill="#fff" font-size="24" font-weight="700">Relational DB</text><text x="910" y="182" fill="#ffedd5" font-size="17">Users • Cars • Rentals</text>
